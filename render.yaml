# One Render web service runs the website, the API and the queue worker (RUN_WORKER=1).
# Database: Neon Postgres (direct connection, not pooled). Region: Singapore.
services:
  - type: web
    name: turnly
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - { key: RUN_WORKER, value: "1" }
      - { key: DATABASE_URL, sync: false }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: ADMIN_TOKEN, sync: false }
      - { key: META_APP_SECRET, sync: false }
      - { key: META_VERIFY_TOKEN, sync: false }
      - { key: META_SYSTEM_USER_TOKEN, sync: false }
      - { key: WABA_ID, sync: false }
      - { key: PHONE_NUMBER_ID, sync: false }
      - { key: OPERATOR_ALERT_PHONE, sync: false }
